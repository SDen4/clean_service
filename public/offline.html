<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет подключения</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      .icon {
        font-size: 48px;
        line-height: 1;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: #94a3b8;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      .contacts {
        background: #1e293b;
        border-radius: 12px;
        padding: 16px;
        text-align: left;
        margin-bottom: 20px;
      }
      .contacts h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #64748b;
        margin: 0 0 12px;
      }
      .contact {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        color: #e2e8f0;
        text-decoration: none;
      }
      .contact:hover {
        color: #60a5fa;
      }
      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
      }
      button:hover {
        background: #2563eb;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>Нет подключения к интернету</h1>
      <p>
        Проверьте соединение и попробуйте снова. Или свяжитесь с нами напрямую:
      </p>

      <div class="contacts">
        <h2>Контакты</h2>
        <a class="contact" href="tel:+79022703888">📞 +7 (902) 27-03-888</a>
        <a class="contact" href="tel:+79222237787">📞 +7 (922) 22-37-787</a>
        <a class="contact" href="bepremont@mail.ru">✉️ bepremont@mail.ru</a>
      </div>

      <button onclick="location.reload()">Попробовать снова</button>
    </div>
  </body>
</html>
